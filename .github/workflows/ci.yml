name: CI Pipeline (Build & Push Docker Image)

# 觸發條件：當代碼 push 到 main 分支時啟動
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 使用 GitHub 提供嘅 Ubuntu 伺服器

    steps:
      # 1. 拉取代碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 安裝 Java 17 (使用 Amazon Corretto，與你本地及 Dockerfile 一致)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven' # 開啟 Maven 緩存，下次 Build 會快好多！

      # 3. 使用 Maven 打包 (與你本地執行嘅指令一樣)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. 登入 Docker Hub (使用你剛才設定嘅 Secrets)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 打包 Docker Image 並推送到 Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 同時打兩個 Tag：一個 latest，一個用 Git 嘅 Commit Hash (用嚟做版本控制)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lotto-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lotto-backend:${{ github.sha }}

      # 6. 自動更新 GitOps 倉庫嘅 Image Tag
      - name: Update Image Tag in GitOps Repository
        env:
          # 使用頭先設定嘅 Token 嚟獲取 Push 權限 (請確認你的 GitHub 用戶名是否正確)
          GITOPS_REPO: https://${{ secrets.GITOPS_TOKEN }}@github.com/tondy-reslve/k8s-helm-gitops.git
        run: |
          # 1. Clone 你個 GitOps 倉庫
          git clone $GITOPS_REPO gitops-repo
          cd gitops-repo/my-app
          
          # 2. 使用 sed 指令，將 values-sit.yaml 入面嘅 tag 自動替換為最新嘅 Commit Hash
          # 留意：${{ github.sha }} 係 GitHub Actions 內置變數，代表當前代碼嘅版本號
          sed -i "s/tag: .*/tag: ${{ github.sha }}/g" values-sit.yaml
          
          # 3. 提交並 Push 上去
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values-sit.yaml
          git commit -m "Auto-update image tag to ${{ github.sha }} for SIT environment"
          git push origin main