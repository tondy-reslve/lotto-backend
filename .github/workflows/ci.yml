name: CI Pipeline (Build & Push Docker Image)

# 觸發條件：當代碼 push 到 main 分支時啟動
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 使用 GitHub 提供嘅 Ubuntu 伺服器

    steps:
      # 1. 拉取代碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 安裝 Java 17 (使用 Amazon Corretto，與你本地及 Dockerfile 一致)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven' # 開啟 Maven 緩存，下次 Build 會快好多！

      # 3. 使用 Maven 打包 (與你本地執行嘅指令一樣)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. 登入 Docker Hub (使用你剛才設定嘅 Secrets)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 打包 Docker Image 並推送到 Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 同時打兩個 Tag：一個 latest，一個用 Git 嘅 Commit Hash (用嚟做版本控制)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lotto-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lotto-backend:${{ github.sha }}